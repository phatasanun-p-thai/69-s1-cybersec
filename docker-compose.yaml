services:
  db:
    image: postgres:17
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: phatsanun
      POSTGRES_PASSWORD: REDACTED
      POSTGRES_DB: phatsanun
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: phatasanun-p@rmutp.ac.th
      PGADMIN_DEFAULT_PASSWORD: REDACTED
    ports:
      - "8081:80"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    depends_on:
      - db
